name: Linux AppImage

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release whose Windows installer is packed into the AppImage
        required: true
        default: '2.2.1'
      publish:
        description: Upload the AppImage to the release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  appimage:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Install the build and test tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends wget xz-utils imagemagick xvfb xdotool ffmpeg pulseaudio \
            libx11-6 libxext6 libxrender1 libxrandr2 libxi6 libxcursor1 libxcomposite1 libxfixes3 libxinerama1 \
            libfreetype6 libfontconfig1 fonts-dejavu-core libgl1 libegl1 libvulkan1 libpulse0 libdbus-1-3

      - name: Download the Windows installer
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "Better-MPC-HC.$TAG.x64.exe" --dir dist

      - name: Build the AppImage
        run: xvfb-run -a bash linux/build-appimage.sh "dist/Better-MPC-HC.$TAG.x64.exe" dist

      - name: Test the AppImage
        run: bash linux/test-appimage.sh "dist/Better-MPC-HC-$TAG-x86_64.AppImage" dist/test

      - name: Upload the test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            dist/test/*.png
            dist/test/*.log

      - name: Upload the AppImage
        uses: actions/upload-artifact@v7
        with:
          name: appimage
          path: dist/*.AppImage

      - name: Publish the AppImage in the release
        if: inputs.publish
        run: gh release upload "$TAG" dist/Better-MPC-HC-$TAG-x86_64.AppImage --repo "$GITHUB_REPOSITORY" --clobber
